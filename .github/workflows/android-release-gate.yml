name: Android Release Gate

permissions:
  contents: read

on:
  push:
    branches: [ main, 'dev/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          test -d "$ANDROID_HOME/build-tools"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
      - name: Static source checks
        run: |
          test -f app/src/main/AndroidManifest.xml
          python3 -m unittest discover -s tests -v
          python3 tools/check_source_policy.py
          test -f app/src/main/java/org/alquds/library/MainActivity.java
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
      - name: Build and unit test
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Run lint
        run: gradle --no-daemon lintDebug
      - name: Generate APK checksum
        working-directory: app/build/outputs/apk/debug
        run: sha256sum *.apk > SHA256SUMS
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Erthi-AlQuds-Library-debug
          retention-days: 7
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error

